name: Release Android and iOS

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in the app
        required: false
        type: string
      prerelease:
        description: Publish as a prerelease without rolling it out
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Phones get the exact bytes that went through CI's analyze, test and build for
# the commit being tagged. The only thing this workflow adds is the Android
# release signature; the iOS IPA stays unsigned on purpose, because SideStore
# signs it with each user's own Apple ID.

jobs:
  ci-run:
    name: Find the CI build of this commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.find.outputs.run_id }}
      apk: ${{ steps.find.outputs.has_apk }}
      ipa: ${{ steps.find.outputs.has_ipa }}
    steps:
      - name: Look for a CI run of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Dispatching right after a push usually finds CI still running the
          # same commit; waiting for it is far cheaper than a second set of
          # builds. A run that ends red, or no run at all, falls through to the
          # build-in-workflow path below.
          pending=""
          run_id=""
          rows="$(gh api "repos/$REPO/actions/runs?head_sha=$COMMIT&per_page=100" --jq '
            .workflow_runs[]
            | select(.name == "CI" and .event == "push" and .head_sha == env.COMMIT)
            | [.id, .status, .conclusion] | @tsv')"
          while IFS=$'\t' read -r id status conclusion; do
            [[ -n "$id" ]] || continue
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              run_id="$id"
              break
            fi
            if [[ "$status" != "completed" ]]; then
              pending="$id"
            fi
          done <<<"$rows"

          if [[ -z "$run_id" && -n "$pending" ]]; then
            echo "CI run $pending is still going; waiting for it."
            for _ in {1..80}; do
              sleep 30
              if [[ "$(gh api "repos/$REPO/actions/runs/$pending" --jq .status)" == "completed" ]]; then
                break
              fi
            done
            conclusion="$(gh api "repos/$REPO/actions/runs/$pending" --jq .conclusion)"
            if [[ "$conclusion" == "success" ]]; then
              run_id="$pending"
            else
              echo "::warning::CI run $pending ended as '$conclusion'; building the binaries in this workflow."
            fi
          fi

          has_apk=false
          has_ipa=false
          if [[ -n "$run_id" ]]; then
            names="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" --jq '
              .artifacts[] | select(.expired | not) | .name')"
            if grep -qx 'android-apk' <<<"$names"; then has_apk=true; fi
            if grep -qx 'ios-unsigned-ipa' <<<"$names"; then has_ipa=true; fi
            echo "Reusing https://github.com/$REPO/actions/runs/$run_id (apk=$has_apk ipa=$has_ipa)"
          else
            echo "No successful CI run for ${COMMIT:0:7}; this workflow builds both binaries."
          fi
          {
            echo "run_id=$run_id"
            echo "has_apk=$has_apk"
            echo "has_ipa=$has_ipa"
          } >>"$GITHUB_OUTPUT"

  android:
    name: Prepare the CI APK
    runs-on: ubuntu-24.04
    needs: ci-run
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download the CI APK
        if: needs.ci-run.outputs.apk == 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: ${{ github.workspace }}/src/client/build/app/outputs/flutter-apk
          repository: ${{ github.repository }}
          run-id: ${{ needs.ci-run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up Java
        if: needs.ci-run.outputs.apk != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: needs.ci-run.outputs.apk != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Cache Gradle
        if: needs.ci-run.outputs.apk != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/client/android/**/*.gradle*', 'src/client/android/**/gradle-wrapper.properties', 'src/client/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # No key.properties here: Gradle falls back to the runner's debug key,
      # exactly like the CI job does. The release job replaces that signature
      # with the release key, so no signing secret touches this build.
      - name: Build release APK
        if: needs.ci-run.outputs.apk != 'true'
        run: flutter build apk --release
        working-directory: src/client

      - name: Upload APK for signing
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-to-sign
          path: src/client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  ios:
    name: Prepare the CI IPA
    runs-on: macos-latest
    needs: ci-run
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download the CI IPA
        if: needs.ci-run.outputs.ipa == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: ${{ github.workspace }}/src/client/build/ios/ipa
          repository: ${{ github.repository }}
          run-id: ${{ needs.ci-run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up Flutter
        if: needs.ci-run.outputs.ipa != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install Flutter dependencies
        if: needs.ci-run.outputs.ipa != 'true'
        run: flutter pub get
        working-directory: src/client

      - name: Cache Swift Package Manager
        if: needs.ci-run.outputs.ipa != 'true'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('src/client/pubspec.lock', 'src/client/ios/Runner.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build iOS release app without code signing
        if: needs.ci-run.outputs.ipa != 'true'
        run: flutter build ios --release --no-codesign
        working-directory: src/client

      # Flutter cannot export an IPA with --no-codesign. Package the unsigned
      # app using the standard IPA Payload layout for artifact handoff.
      - name: Package unsigned IPA
        if: needs.ci-run.outputs.ipa != 'true'
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload LegacyTracker.ipa
        working-directory: src/client

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: src/client/build/ios/ipa/LegacyTracker.ipa
          if-no-files-found: error
          retention-days: 1

  release:
    name: Sign the APK and publish
    needs: [android, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # apksigner and zipalign are shell scripts; the Android SDK that ships
      # with the runner (ANDROID_HOME) provides them next to a Java runtime.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the APK to sign
        uses: actions/download-artifact@v8
        with:
          name: android-apk-to-sign
          path: ${{ runner.temp }}/android-apk-to-sign

      - name: Download unsigned IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/ios-unsigned-ipa

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/legacytracker-release.jks"
          chmod 600 "$RUNNER_TEMP/legacytracker-release.jks"

      - name: Validate restored Android signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/legacytracker-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | sed -n -E '/Alias name:|Entry type:|SHA256:/p'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
          STAGED_APK: ${{ runner.temp }}/android-apk-to-sign/app-release.apk
          IOS_IPA: ${{ runner.temp }}/ios-unsigned-ipa/LegacyTracker.ipa
          ANDROID_KEYSTORE: ${{ runner.temp }}/legacytracker-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(--yes --apk "$STAGED_APK" --ipa "$IOS_IPA")
          if [[ -n "$RELEASE_NOTES" ]]; then
            args+=(--notes "$RELEASE_NOTES")
          fi
          if [[ '${{ inputs.prerelease }}' == 'true' ]]; then
            args+=(--prerelease)
          fi
          scripts/release-android.sh "${args[@]}"
