name: Release Android and iOS

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in the app
        required: false
        type: string
      prerelease:
        description: Publish as a prerelease without rolling it out
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  ios:
    name: Prepare unsigned iOS IPA
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Find a usable IPA from CI
        id: ci_ipa
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          run_id="$(gh api "repos/$REPO/actions/runs?head_sha=$COMMIT&per_page=100" --jq '
            .workflow_runs[]
            | select(.name == "CI" and .event == "push"
                     and .head_sha == env.COMMIT and .head_branch == env.REF_NAME
                     and .status == "completed" and .conclusion == "success")
            | .id' | head -n 1)"
          if [[ -n "$run_id" ]] && ! gh api "repos/$REPO/actions/runs/$run_id/artifacts" --jq '
              .artifacts[]
              | select(.name == "ios-unsigned-ipa" and (.expired | not))
              | .id' | grep -q .; then
            echo "CI run $run_id kept no ios-unsigned-ipa artifact; building one here."
            run_id=""
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -n "$run_id" ]]; then
            echo "Reusing the IPA from https://github.com/$REPO/actions/runs/$run_id"
          else
            echo "No successful CI run for ${COMMIT:0:7} on $REF_NAME; building the IPA here."
          fi

      - name: Download the CI IPA
        if: steps.ci_ipa.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: ${{ github.workspace }}/src/client/build/ios/ipa
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci_ipa.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Flutter
        if: steps.ci_ipa.outputs.run_id == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install Flutter dependencies
        if: steps.ci_ipa.outputs.run_id == ''
        run: flutter pub get
        working-directory: src/client

      - name: Cache Swift Package Manager
        if: steps.ci_ipa.outputs.run_id == ''
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('src/client/pubspec.lock', 'src/client/ios/Runner.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build iOS release app without code signing
        if: steps.ci_ipa.outputs.run_id == ''
        run: flutter build ios --release --no-codesign
        working-directory: src/client

      # Flutter cannot export an IPA with --no-codesign. Package the unsigned
      # app using the standard IPA Payload layout for artifact handoff.
      - name: Package unsigned IPA
        if: steps.ci_ipa.outputs.run_id == ''
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload LegacyTracker.ipa
        working-directory: src/client

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: src/client/build/ios/ipa/LegacyTracker.ipa
          retention-days: 1

  release:
    name: Build and publish release
    needs: ios
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      # No `flutter pub get` here on purpose: the runner's Flutter is older than
      # the one that generated pubspec.lock, so resolving rewrites it, and
      # release-android.sh refuses to publish from a dirty tree. The build inside
      # the script resolves dependencies after that check.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/client/android/**/*.gradle*', 'src/client/android/**/gradle-wrapper.properties', 'src/client/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download unsigned IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/ios-unsigned-ipa

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/legacytracker-release.jks"
          chmod 600 "$RUNNER_TEMP/legacytracker-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/legacytracker-release.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" \
            > src/client/android/key.properties
          chmod 600 src/client/android/key.properties

      - name: Validate restored Android signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/legacytracker-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | sed -n -E '/Alias name:|Entry type:|SHA256:/p'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
          IOS_IPA: ${{ runner.temp }}/ios-unsigned-ipa/LegacyTracker.ipa
        run: |
          args=(--yes --ipa "$IOS_IPA")
          if [[ -n "$RELEASE_NOTES" ]]; then
            args+=(--notes "$RELEASE_NOTES")
          fi
          if [[ '${{ inputs.prerelease }}' == 'true' ]]; then
            args+=(--prerelease)
          fi
          scripts/release-android.sh "${args[@]}"
