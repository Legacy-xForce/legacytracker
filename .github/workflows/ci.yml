name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter-env
      - name: Analyze
        run: flutter analyze
        working-directory: src/client
      - name: Test
        run: flutter test
        working-directory: src/client
      - name: Cache Gradle
        uses: ./.github/actions/gradle-cache
      # The native tracking engine's safety net: PathSampler, StopDetector and
      # the drive simulation. :app only, plugin modules ship tests of their own.
      - name: Engine unit tests (Kotlin)
        run: ./gradlew :app:testDebugUnitTest
        working-directory: src/client/android
      - name: Build release APK
        run: flutter build apk --release
        working-directory: src/client
      # No key.properties on CI, so Gradle falls back to the runner's debug key.
      # The release workflow re-signs this APK with the release key; publishing
      # it as it is here would be refused by every installed phone.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: src/client/build/app/outputs/flutter-apk/*.apk

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-env
      - name: Cache Swift Package Manager
        uses: ./.github/actions/spm-cache
      - name: Build iOS release app without code signing
        run: flutter build ios --release --no-codesign
        working-directory: src/client

      # Flutter cannot export an IPA with --no-codesign. Package the unsigned
      # app using the standard IPA Payload layout for artifact handoff.
      - name: Package unsigned IPA
        uses: ./.github/actions/package-ipa
      - name: Upload unsigned iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: src/client/build/ios/ipa/LegacyTracker.ipa

      # The Swift engine replays the vectors the Kotlin tests write
      # (src/client/test/fixtures/tracking-vectors.json). A simulator build
      # is slow, so only when either engine or the vectors changed.
      - name: Did either tracking engine change?
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only -R ${{ github.repository }})
          else
            files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" -q '.files[].filename' || echo src/client/ios/)
          fi
          if grep -qE '^(src/client/ios/|src/client/test/fixtures/tracking-vectors\.json|src/client/android/app/src/main/kotlin/com/legacy/legacytracker/tracking/)' <<<"$files"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Engine unit tests (Swift)
        if: steps.engine.outputs.changed == 'true'
        working-directory: src/client
        run: |
          set -o pipefail
          flutter build ios --config-only --simulator --debug
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "id=$udid" -only-testing:RunnerTests/TrackingVectorsTests \
            CODE_SIGNING_ALLOWED=NO | tail -n 80

  web:
    name: Check web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
        working-directory: src/web
      - run: npm run format:check
        working-directory: src/web
      - run: npm test
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
        env:
          # Public Mapbox token, restricted to the app's origins. The build
          # fails clearly when it is missing (see docs/mapbox.md).
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN_WEB }}

  server:
    name: Check server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/server/package-lock.json
      - run: npm ci
        working-directory: src/server
      - run: npm run format:check
        working-directory: src/server
      - run: npm run build
        working-directory: src/server
      - run: npm test
        working-directory: src/server

  server-docker-meta:
    name: Prepare server image metadata
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v7
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/legacytracker" >> "$GITHUB_OUTPUT"
      # OCI labels include the source repository and commit revision, which is
      # what links the GHCR package back to this repository and commit.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

  server-docker:
    name: Build server Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: server-docker-meta
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.server-docker-meta.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture are much faster than QEMU emulation.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: src/server
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.server-docker-meta.outputs.labels }}
          # Push by digest; the merge job below assembles the multi-arch manifest.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tracker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tracker-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  server-docker-manifest:
    name: Publish multi-arch server image
    runs-on: ubuntu-24.04
    needs: [server-docker-meta, server-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.server-docker-meta.outputs.image }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create multi-arch manifest
        env:
          TAGS: ${{ needs.server-docker-meta.outputs.tags }}
        run: |
          cd /tmp/digests
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=("--tag" "$tag")
          done <<< "$TAGS"
          for digest in *; do
            args+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK and COOLIFY_TOKEN are not configured; skipping Coolify deployment."
            exit 0
          fi
          # Coolify rejects GET with 405; the deploy endpoint is POST-only.
          curl --fail-with-body --silent --show-error \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"force": false}'
