name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter-env
      - name: Analyze
        run: flutter analyze
        working-directory: src/client
      - name: Test
        run: flutter test
        working-directory: src/client
      - name: Cache Gradle
        uses: ./.github/actions/gradle-cache
      - name: Build release APK
        run: flutter build apk --release
        working-directory: src/client
      # The native tracking engine's safety net: PathSampler, StopDetector,
      # the drive simulation and the shared vectors. :app only, plugin modules ship
      # tests of their own. After the APK build: that is what generates gradlew.
      - name: Engine unit tests (Kotlin)
        run: ./gradlew :app:testDebugUnitTest
        working-directory: src/client/android
      # Fork PRs get a read-only workflow token with no OIDC access, so an
      # attestation cannot be minted there; every other run attests the APK.
      - name: Attest APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: src/client/build/app/outputs/flutter-apk/*.apk
      # No key.properties on CI, so Gradle falls back to the runner's debug key.
      # The release workflow re-signs this APK with the release key; publishing
      # it as it is here would be refused by every installed phone.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: src/client/build/app/outputs/flutter-apk/*.apk

  ios:
    name: Build iOS
    runs-on: macos-latest
    permissions:
      contents: read
      # The engine-change probe below reads the pull request diff through the API.
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-env
      - name: Cache Swift Package Manager
        uses: ./.github/actions/spm-cache
      - name: Build iOS release app without code signing
        run: flutter build ios --release --no-codesign
        working-directory: src/client

      # Flutter cannot export an IPA with --no-codesign. Package the unsigned
      # app using the standard IPA Payload layout for artifact handoff.
      - name: Package unsigned IPA
        uses: ./.github/actions/package-ipa
      # The IPA ships unsigned, so this attestation covers the bytes phones
      # download from the release, not just a handoff copy.
      - name: Attest unsigned IPA
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: src/client/build/ios/ipa/LegacyTracker.ipa
      - name: Upload unsigned iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: src/client/build/ios/ipa/LegacyTracker.ipa

      # The Swift engine replays the vectors the Kotlin tests write
      # (src/client/test/fixtures/tracking-vectors.json). A simulator build
      # is slow, so only when either engine or the vectors changed.
      - name: Did either tracking engine change?
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only -R ${{ github.repository }})
          else
            files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" -q '.files[].filename' || echo src/client/ios/)
          fi
          if grep -qE '^(src/client/ios/|src/client/test/fixtures/tracking-vectors\.json|src/client/android/app/src/main/kotlin/com/legacy/legacytracker/tracking/)' <<<"$files"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Engine unit tests (Swift)
        if: steps.engine.outputs.changed == 'true'
        working-directory: src/client
        run: |
          set -o pipefail
          flutter build ios --config-only --simulator --debug
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "id=$udid" -only-testing:RunnerTests/TrackingVectorsTests \
            CODE_SIGNING_ALLOWED=NO | tail -n 80

  # A rolling prerelease with the exact --release binaries from the two jobs
  # above, named after the commit they came from. Assets are raw files (not the
  # ZIP-wrapped Actions artifacts), so they can be downloaded and installed
  # straight from the release page. Stable releases stay untouched: this tag is
  # not android-v<name>+<code> and the release is a prerelease, so the server's
  # stable feed rejects it twice over.
  nightly:
    name: Publish nightly prerelease
    runs-on: ubuntu-24.04
    needs: [android, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Two pushes close together must not fight over the one rolling release.
    concurrency:
      group: nightly-prerelease
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the CI release APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: ${{ runner.temp }}/nightly
      - name: Download the CI release IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/nightly

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nightly-release.jks"
          chmod 600 "$RUNNER_TEMP/nightly-release.jks"

      # Nightly must be installable over a stable build (and back), so it uses
      # the same key as releases. Only this job — never PR builds — sees the
      # secret, and it signs a copy of CI's artifact; the artifact itself stays
      # unchanged for the release workflow to re-sign on its own.
      - name: Sign and name the nightly APK
        id: assets
        env:
          COMMIT: ${{ github.sha }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!var}"
          done
          short="${COMMIT:0:7}"
          version="$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p' src/client/pubspec.yaml)"
          name="${version%+*}"
          code="${version##*+}"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          zipalign="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -1)"
          test -x "$apksigner" && test -x "$zipalign"

          aligned="$RUNNER_TEMP/nightly/aligned.apk"
          signed="$RUNNER_TEMP/nightly/legacytracker-$short.apk"
          "$zipalign" -f -p 4 "$RUNNER_TEMP/nightly/app-release.apk" "$aligned"
          "$apksigner" sign --ks "$RUNNER_TEMP/nightly-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$signed" "$aligned"
          rm -f "$aligned"

          # The published APK must use the same key as stable releases, or
          # switching channels would leave phones with an un-installable build.
          certs="$("$apksigner" verify --print-certs "$signed" 2>&1)"
          fingerprint="$(sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' <<<"$certs" | head -n 1)"
          expected="$(tr -d '[:space:]' < src/client/android/release-signing-cert.sha256)"
          test "$fingerprint" = "$expected"

          ipa="$RUNNER_TEMP/nightly/LegacyTracker-$short.ipa"
          mv "$RUNNER_TEMP/nightly/LegacyTracker.ipa" "$ipa"

          {
            echo "short=$short"
            echo "apk=$signed"
            echo "ipa=$ipa"
            echo "version_name=$name"
            echo "version_code=$code"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the published nightly binaries
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.ipa }}

      # One rolling release, rewritten on every push. Naming assets after the
      # commit makes each build distinguishable; pruning keeps old builds
      # downloadable for a while without letting the release grow forever.
      - name: Publish to the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          SHORT: ${{ steps.assets.outputs.short }}
          APK: ${{ steps.assets.outputs.apk }}
          IPA: ${{ steps.assets.outputs.ipa }}
          VERSION_NAME: ${{ steps.assets.outputs.version_name }}
          VERSION_CODE: ${{ steps.assets.outputs.version_code }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Nightly build from commit $COMMIT. Replaced after every successful CI run on main.

          <!-- legacytracker-nightly {"version_name":"$VERSION_NAME","version_code":$VERSION_CODE,"commit":"$SHORT"} -->
          EOF
          )
          if gh release view nightly -R "$REPO" >/dev/null 2>&1; then
            gh release edit nightly -R "$REPO" --prerelease --notes "$notes"
          else
            gh release create nightly -R "$REPO" --prerelease --target "$COMMIT" \
              --title "Nightly build" --notes "$notes"
          fi
          gh release upload nightly "$APK" "$IPA" -R "$REPO" --clobber

          # Keep the three newest builds (two assets each), for rollback.
          gh release view nightly -R "$REPO" --json assets \
            --jq '.assets | map(select(.name | test("^(legacytracker|LegacyTracker)-[0-9a-f]{7}\\.(apk|ipa)$")))
                  | sort_by(.createdAt) | .[:-6] | .[].name' |
            while IFS= read -r old; do
              [[ -n "$old" ]] && gh release delete-asset nightly "$old" -R "$REPO" --yes
            done

          echo "Published https://github.com/$REPO/releases/tag/nightly (commit $SHORT)"

  # Same-repo PRs get a tappable, raw APK link instead of a ZIP-wrapped Actions
  # artifact. A dedicated non-prerelease release with --latest=false serves the
  # bytes directly: it never becomes `releases/latest` and its tag does not
  # match either update feed. Fork PRs (and Dependabot) get no signing secrets
  # or write token, so they keep using the ordinary artifacts above.
  pr-link:
    name: Post a direct APK link on the PR
    runs-on: ubuntu-24.04
    needs: android
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the PR release APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: ${{ runner.temp }}/pr-apk

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pr-release.jks"
          chmod 600 "$RUNNER_TEMP/pr-release.jks"

      # Same key as releases/nightlies: the APK installs right over the
      # current build, so testing a PR needs no uninstall and no data loss.
      # This job only runs for PRs from this repository, where the secrets are
      # available; fork PRs keep the unsigned CI artifact.
      - name: Sign and name the PR APK
        id: sign
        env:
          COMMIT: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!var}"
          done
          asset="legacytracker-pr-$PR-${COMMIT:0:7}.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          zipalign="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -1)"
          test -x "$apksigner" && test -x "$zipalign"

          aligned="$RUNNER_TEMP/pr-apk/aligned.apk"
          signed="$RUNNER_TEMP/pr-apk/$asset"
          "$zipalign" -f -p 4 "$RUNNER_TEMP/pr-apk/app-release.apk" "$aligned"
          "$apksigner" sign --ks "$RUNNER_TEMP/pr-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$signed" "$aligned"
          rm -f "$aligned"

          certs="$("$apksigner" verify --print-certs "$signed" 2>&1)"
          fingerprint="$(sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' <<<"$certs" | head -n 1)"
          expected="$(tr -d '[:space:]' < src/client/android/release-signing-cert.sha256)"
          test "$fingerprint" = "$expected"

          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish the APK and comment its link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.sha }}
          ASSET: ${{ steps.sign.outputs.asset }}
        run: |
          set -euo pipefail
          asset="$ASSET"
          short="${COMMIT:0:7}"
          if ! gh release view pr-builds -R "$REPO" >/dev/null 2>&1; then
            gh release create pr-builds -R "$REPO" --latest=false \
              --target "$COMMIT" --title "PR builds" \
              --notes "Unreviewed release APKs built by CI for pull requests. Do not use as a daily driver."
          fi
          gh release upload pr-builds "$RUNNER_TEMP/pr-apk/$asset" -R "$REPO" --clobber

          # Keep the twenty newest PR builds so the release cannot grow forever.
          gh release view pr-builds -R "$REPO" --json assets \
            --jq '.assets | sort_by(.createdAt) | .[:-20] | .[].name' |
            while IFS= read -r old; do
              [[ -n "$old" ]] && gh release delete-asset pr-builds "$old" -R "$REPO" --yes
            done

          url="https://github.com/$REPO/releases/download/pr-builds/$asset"
          marker='<!-- legacytracker-pr-build -->'
          body=$(cat <<EOF
          ### PR build ready

          [Download the Android APK]($url) (commit \`$short\`). Open the file on your
          phone to install — no ZIP to extract, no uninstall first. PR builds use
          the release signing key, so this installs right over your current app.

          $marker
          EOF
          )
          # Replace the previous comment instead of piling one up per push.
          existing="$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body"
          fi
          echo "Posted $url on PR #$PR"

  web:
    name: Check web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
        working-directory: src/web
      - run: npm run format:check
        working-directory: src/web
      - run: npm test
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
        env:
          # Public Mapbox token, restricted to the app's origins. The build
          # fails clearly when it is missing (see docs/mapbox.md).
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN_WEB }}

  server:
    name: Check server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/server/package-lock.json
      - run: npm ci
        working-directory: src/server
      - run: npm run format:check
        working-directory: src/server
      - run: npm run build
        working-directory: src/server
      - run: npm test
        working-directory: src/server

  server-docker-meta:
    name: Prepare server image metadata
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v7
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/legacytracker" >> "$GITHUB_OUTPUT"
      # OCI labels include the source repository and commit revision, which is
      # what links the GHCR package back to this repository and commit.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

  server-docker:
    name: Build server Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: server-docker-meta
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: ${{ needs.server-docker-meta.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture are much faster than QEMU emulation.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: src/server
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.server-docker-meta.outputs.labels }}
          # Push by digest; the merge job below assembles the multi-arch manifest.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tracker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tracker-${{ matrix.arch }}
      # Provenance for the single-arch image, so a consumer pinning this digest
      # can verify it.
      - name: Attest ${{ matrix.arch }} image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  server-docker-manifest:
    name: Publish multi-arch server image
    runs-on: ubuntu-24.04
    needs: [server-docker-meta, server-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: ${{ needs.server-docker-meta.outputs.image }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create multi-arch manifest
        env:
          TAGS: ${{ needs.server-docker-meta.outputs.tags }}
        run: |
          cd /tmp/digests
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=("--tag" "$tag")
          done <<< "$TAGS"
          for digest in *; do
            args+=("${IMAGE_NAME}@sha256:${digest}")
          done
          # The metadata file holds the manifest list descriptor, whose digest is
          # what consumers resolve when they pull a tag; that is the subject
          # attested below, alongside the per-architecture digests of the build job.
          docker buildx imagetools create --metadata-file /tmp/manifest-metadata.json "${args[@]}"
      - name: Read manifest list digest
        id: subject
        run: echo "digest=$(jq -re '."containerimage.descriptor".digest' /tmp/manifest-metadata.json)" >> "$GITHUB_OUTPUT"
      - name: Attest multi-arch image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK and COOLIFY_TOKEN are not configured; skipping Coolify deployment."
            exit 0
          fi
          # Coolify rejects GET with 405; the deploy endpoint is POST-only.
          curl --fail-with-body --silent --show-error \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"force": false}'
