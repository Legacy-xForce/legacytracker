name: Package unsigned IPA
description: >-
  Flutter cannot export an IPA with --no-codesign, so wrap the built app in the
  standard IPA Payload layout (build/ios/ipa/LegacyTracker.ipa).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p build/ios/ipa/Payload
        cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
        cd build/ios/ipa
        ditto -c -k --sequesterRsrc --keepParent Payload LegacyTracker.ipa
      working-directory: src/client
