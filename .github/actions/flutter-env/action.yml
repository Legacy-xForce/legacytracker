name: Flutter environment
description: >-
  Install the pinned Flutter SDK and fetch the app's packages. The version lives
  here and nowhere else in CI; mise.toml and the README quote the same number.
inputs:
  flutter-version:
    description: Flutter SDK version (keep in step with mise.toml).
    default: 3.44.0
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
    - name: Install Flutter dependencies
      shell: bash
      run: flutter pub get
      working-directory: src/client
